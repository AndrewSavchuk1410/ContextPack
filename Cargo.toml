[workspace]
members = [
    "crates/contextpack-core",
    "crates/contextpack-render",
    "crates/contextpack-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
grep-matcher = "0.1"
grep-regex = "0.1"
hex = "0.4"
ignore = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.15"
thiserror = "2.0"
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"
